services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: latepayer
      POSTGRES_PASSWORD: latepayer
      POSTGRES_DB: latepayer
    ports:
      - "5432:5432"
    volumes:
      - latepayer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latepayer -d latepayer"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  latepayer-postgres:

name: Demo health wake-up
on:
  workflow_dispatch:
  schedule:
    # Render's free services can spin down after 15 minutes without a request.
    # Offset runs from minute 0 to avoid GitHub's busiest schedule boundary.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions: {}
concurrency:
  group: demo-health
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep the API and web services warm
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/healthz
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 https://latepayer-web.onrender.com/ -o /dev/null

      - name: Verify deployed read paths on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 'https://latepayer-api.onrender.com/portfolio?view=open&page=1&page_size=1' -o /tmp/portfolio.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/action-queue -o /tmp/action-queue.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/facts/morning-brief -o /tmp/morning-brief.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/demo-stories -o /tmp/demo-stories.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/evaluation -o /tmp/evaluation.json
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://latepayer-api.onrender.com/ai/status -o /tmp/ai-status.json
          invoice_id="$(python -c 'import json; payload=json.load(open("/tmp/portfolio.json")); print(payload["items"][0]["id"])')"
          test -n "$invoice_id"
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 "https://latepayer-api.onrender.com/invoices/$invoice_id" -o /dev/null
          python -c 'import json; status=json.load(open("/tmp/ai-status.json")); assert status["configured"], "GEMINI_API_KEY is not configured on the deployed API"; print("AI provider configuration:", status["provider"], status["model"])'
          python -c 'import json; assert json.load(open("/tmp/demo-stories.json"))["items"]; assert json.load(open("/tmp/evaluation.json")); assert json.load(open("/tmp/morning-brief.json"))["as_of"]'
